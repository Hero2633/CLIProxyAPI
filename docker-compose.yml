services:
  cli-proxy-api:
    # 镜像名称；可通过 .env 或实例环境文件覆盖。
    image: ${CLI_PROXY_IMAGE:-cliproxyapi-local:latest}

    # 不自动拉取远端镜像；优先使用本地构建结果。
    pull_policy: never

    # 本地构建镜像配置。
    build:
      # 构建上下文目录；固定为当前项目根目录。
      context: .

      # 构建所使用的 Dockerfile。
      dockerfile: Dockerfile

      # 构建参数；可由实例环境文件覆盖。
      args:
        # 镜像版本号。
        VERSION: ${VERSION:-latest}

        # 提交哈希。
        COMMIT: ${COMMIT:-none}

        # 构建时间。
        BUILD_DATE: ${BUILD_DATE:-unknown}

    # 容器名称；建议带上提供商前缀和实例名，例如 codex-a、gemini-a。
    container_name: ${CONTAINER_NAME:-cli-proxy-api}

    # 容器运行时环境变量。
    environment:
      # 自定义部署标记。
      DEPLOY: ${DEPLOY:-}

      # 管理后台密钥；由实例环境文件注入。
      MANAGEMENT_PASSWORD: "${MANAGEMENT_PASSWORD}"

      # 容器访问上游时使用的 HTTP 代理；默认走宿主机 7890。
      HTTP_PROXY: ${HTTP_PROXY:-http://host.docker.internal:7890}

      # 容器访问上游时使用的 HTTPS 代理；默认走宿主机 7890。
      HTTPS_PROXY: ${HTTPS_PROXY:-http://host.docker.internal:7890}

      # 容器访问上游时使用的通用代理；默认走宿主机 7890。
      ALL_PROXY: ${ALL_PROXY:-http://host.docker.internal:7890}

    # 让容器能够通过 host.docker.internal 访问宿主机。
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # 端口映射；宿主机端口由实例环境文件控制。
    ports:
      # 将宿主机端口映射到容器 8317；每个实例只需要在 .env 里控制宿主机端口即可。
      - "${HOST_PORT:-8317}:8317"

    # 挂载关系；配置文件、授权目录、日志目录都可由实例环境文件控制。
    volumes:
      # 挂载当前实例专属配置文件。
      - ${CLI_PROXY_CONFIG_PATH:-./config.yaml}:/CLIProxyAPI/config.yaml

      # 挂载当前实例专属授权目录；例如 auths/codex 或 auths/gemini。
      - ${CLI_PROXY_AUTH_PATH:-./auths/codex}:/root/.cli-proxy-api

      # 挂载当前实例专属日志目录。
      - ${CLI_PROXY_LOG_PATH:-./logs}:/CLIProxyAPI/logs

    # 容器异常退出后自动重启。
    restart: unless-stopped
